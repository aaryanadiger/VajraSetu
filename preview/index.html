<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vajra सेतु</title>
  <meta name="description" content="Vajra सेतु – Worker exposure monitoring and safety management app." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --white: #ffffff;
      --blue-primary: #2b96ff;
      --blue-btn-bg: #a8d4ff;
      --text-primary: #111111;
      --text-secondary: #6B7280;
      --green: #22C55E;
      --shadow-card: 0 8px 40px rgba(100, 160, 230, 0.13);
      --radius-card: 28px;
      --radius-btn: 22px;
      --radius-dropdown: 50px;
    }

    html,
    body {
      height: 100%;
      background: linear-gradient(160deg, #dce8f8 0%, #b8d0f0 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'DM Sans', sans-serif;
    }

    /* ──────────── PHONE SHELL ──────────── */
    .phone {
      width: 390px;
      height: 844px;
      background: linear-gradient(175deg, #f5f8ff 0%, #e8f1fb 48%, #c8daf4 100%);
      border-radius: 52px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow:
        0 0 0 11px #1a1a2e,
        0 0 0 13px #2a2a3e,
        0 50px 100px rgba(0, 0, 0, 0.40);
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* ──────────── HEADER ──────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 54px 24px 12px;
    }

    .logo {
      font-family: 'Crimson Text', 'Noto Sans Devanagari', serif;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: -1.2px;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .translate-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    .translate-btn:hover {
      opacity: 1;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2.5px solid var(--blue-primary);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #5aabff 0%, #3b7ee8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ──────────── EXPOSURE SECTION ──────────── */
    .exposure-section {
      padding: 20px 24px 28px;
    }

    .section-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -1px;
      color: var(--text-primary);
      line-height: 1.15;
      margin-bottom: 22px;
    }

    .exposure-value {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 16px;
    }

    .exposure-number {
      font-family: 'DM Sans', sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -2px;
    }

    .exposure-unit {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    /* ──────────── SEGMENTED PROGRESS BAR ──────────── */
    .progress-wrapper {
      margin-bottom: 8px;
    }

    .segmented-bar {
      display: flex;
      gap: 3px;
      height: 18px;
      margin-bottom: 8px;
      position: relative;
      align-items: center;
    }

    .seg {
      flex: 1;
      height: 100%;
      border-radius: 2.5px;
      background: #D0D8E4;
    }

    .threshold-marker {
      position: absolute;
      left: calc(50% - 1px);
      top: -4px;
      bottom: -4px;
      width: 2px;
      background: #8fa8c8;
      border-radius: 1px;
      z-index: 2;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
    }

    .progress-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .threshold-label {
      text-align: right;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: var(--text-secondary);
      margin-top: 6px;
      font-weight: 400;
      letter-spacing: -0.4px;
    }

    /* ──────────── WHITE CARD ──────────── */
    .card {
      background: var(--white);
      border-radius: var(--radius-card);
      margin: 0 12px 16px;
      padding: 24px 22px 26px;
      box-shadow: var(--shadow-card);
    }

    .card-section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }

    /* ──────────── DROPDOWN ──────────── */
    .dropdown-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 22px;
    }

    .dropdown-select {
      width: 100%;
      background: #a8d4ff;
      border: none;
      border-radius: var(--radius-dropdown);
      padding: 12px 44px 12px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.4px;
      color: var(--text-primary);
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      outline: none;
      transition: background 0.2s;
    }

    .dropdown-select:hover {
      background: #90c5fa;
    }

    .dropdown-chevron {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* ──────────── BAND STATUS ROW ──────────── */
    .band-status-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .band-status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .band-status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 2px;
    }

    .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
      animation: pulse-green 2s infinite;
    }

    @keyframes pulse-green {

      0%,
      100% {
        box-shadow: 0 0 5px rgba(34, 197, 94, 0.4);
      }

      50% {
        box-shadow: 0 0 14px rgba(34, 197, 94, 0.75);
      }
    }

    .status-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .expiry-section {
      text-align: right;
    }

    .expiry-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      font-weight: 400;
      opacity: 0.8;
      margin-bottom: 4px;
    }

    .expiry-date {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    /* ──────────── ACTION BUTTONS ──────────── */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .action-btn {
      background: var(--blue-btn-bg);
      border: none;
      border-radius: var(--radius-btn);
      padding: 22px 12px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .action-btn:hover {
      background: #90c5fa;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(59, 126, 232, 0.22);
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 300;
      color: var(--text-primary);
      text-align: center;
      letter-spacing: -0.4px;
    }

    /* ──────────── BOTTOM NAV ──────────── */
    .bottom-nav {
      background: linear-gradient(180deg, rgba(200, 220, 245, 0.7) 0%, rgba(180, 210, 240, 0.95) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      padding: 10px 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 10px 28px;
      border-radius: 20px;
      transition: all 0.2s;
      touch-action: manipulation;
    }

    .nav-item svg {
      width: 28px;
      height: 28px;
    }

    /* ──────────── ANIMATIONS ──────────── */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      animation: fadeInUp 0.4s ease 0.00s both;
    }

    .exposure-section {
      animation: fadeInUp 0.4s ease 0.08s both;
    }

    .card {
      animation: fadeInUp 0.4s ease 0.16s both;
    }

    .bottom-nav {
      animation: fadeInUp 0.3s ease 0.06s both;
    }

    /* ──────────── RESPONSIVE: real phone ──────────── */
    @media (max-width: 430px) {

      html,
      body {
        background: linear-gradient(175deg, #f5f8ff 0%, #e8f1fb 48%, #c8daf4 100%);
        align-items: flex-start;
      }

      .phone {
        width: 100%;
        height: 100%;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>

    <div class="scroll-area">

      <!-- ── HEADER ── -->
      <header class="header">
        <div class="logo">Vajra सेतु</div>
        <div class="header-right">
          <!-- Translate Icon matching Figma (中A bilingual icon) -->

            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

              <text x="13" y="22" font-family="'DM Sans', sans-serif" font-size="9" fill="#333"

              <line x1="13" y1="23" x2="20.5" y2="23" stroke="#333" stroke-width="1.2" stroke-linecap="round" />
            </svg>
          </div>
          <!-- Avatar -->
          <div class="avatar" id="avatarEl">
            <div class="avatar-placeholder">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="8" r="4" fill="rgba(255,255,255,0.9)" />
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="rgba(255,255,255,0.9)" />
              </svg>
            </div>
          </div>
        </div>
      </header>

      <!-- ── EXPOSURE SECTION ── -->
      <section class="exposure-section">
        <h1 class="section-title">Today's Exposure</h1>

        <div class="exposure-value">
          <span class="exposure-number" id="exposureNum">23</span>
          <span class="exposure-unit">ppm.hr</span>
        </div>

        <div class="progress-wrapper">

            <div class="threshold-marker" id="thresholdMarker"></div>
          </div>

            <line x1="16" y1="2" x2="16" y2="6" />

          Shift Duration
        </div>

        <div class="dropdown-wrapper">
          <select class="dropdown-select" id="shiftSelect" aria-label="Select shift">

          <div>

              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.8"

                <rect x="7" y="7" width="10" height="10" rx="3" />

              Band Status
            </div>
            <div class="band-status-indicator">
              <span class="status-dot" role="img" aria-label="Active"></span>
              <span class="status-text">VALID</span>
            </div>
          </div>

          <div class="expiry-section">
            <div class="expiry-label">Expected Expiry</div>

              <line x1="17" y1="29" x2="30" y2="29" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" />

              <path d="M26 13 C30 9 39 9 43 11 L43 40 C39 38 30 38 26 42 Z" stroke="#1a1a1a" stroke-width="1.8"

              <line x1="26" y1="13" x2="26" y2="42" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" />

    <!-- ── BOTTOM NAVIGATION ── -->

      <!-- QR Scan -->

            stroke-linejoin="round" />
        </svg>
      </div>

    </nav>
  </div><!-- /phone -->

  <script>
    /* ── Build segmented progress bar with gradient fade ── */
    (function () {
      const bar = document.getElementById('segBar');
      const total = 50;
      const value = 23;
      const max = 100;
      const filledCount = Math.round((value / max) * total);
      const marker = document.getElementById('thresholdMarker');

      for (let i = 0; i < total; i++) {
        const seg = document.createElement('div');
        seg.className = 'seg';

        if (i < filledCount) {
          const ratio = i / filledCount;
          if (ratio < 0.4) {
            seg.style.background = '#1e6fff';
          } else if (ratio < 0.65) {
            seg.style.background = '#3d8fff';
          } else if (ratio < 0.82) {
            seg.style.background = '#60aaff';
          } else {
            const fade = (ratio - 0.82) / 0.18;
            const r = Math.round(96 + fade * 100);
            const g = Math.round(170 + fade * 25);
            const b = 255;
            seg.style.background = `rgb(${r},${g},${b})`;
            seg.style.opacity = (1 - fade * 0.35).toFixed(2);
          }
        }

        bar.insertBefore(seg, marker);
      }
    })();

    /* ── Bottom nav state management ── */
    const NAV_ACTIVE = '#2b96ff';
    const NAV_INACTIVE = '#9CA3AF';

    const navConfig = {
      navHome: {
        strokes: ['#home-fill', '#home-door'],
        fills: []
      },
      navQR: {
        strokes: ['#qr-tl-box', '#qr-tr-box', '#qr-bl-box', '#qr-line1', '#qr-line2', '#qr-line3', '#qr-line4', '#qr-line5', '#qr-line6'],
        fills: ['#qr-tl-dot', '#qr-tr-dot', '#qr-bl-dot']
      },
      navHistory: {
        strokes: ['#hist-arr', '#hist-circle', '#hist-hand'],
        fills: []
      }
    };

    let currentNav = null;

    function setNav(id) {
      if (currentNav) {
        const prev = navConfig[currentNav];
        prev.strokes.forEach(sel => {
          const el = document.querySelector(sel);
          if (el) el.setAttribute('stroke', NAV_INACTIVE);
        });
        prev.fills.forEach(sel => {
          const el = document.querySelector(sel);
          if (el) el.setAttribute('fill', NAV_INACTIVE);
        });
        document.getElementById(currentNav).style.background = '';
      }

      currentNav = id;
      const next = navConfig[id];
      next.strokes.forEach(sel => {
        const el = document.querySelector(sel);
        if (el) el.setAttribute('stroke', NAV_ACTIVE);
      });
      next.fills.forEach(sel => {
        const el = document.querySelector(sel);
        if (el) el.setAttribute('fill', NAV_ACTIVE);
      });
      document.getElementById(id).style.background = 'rgba(43, 150, 255, 0.10)';
    }

    setNav('navHome');

    /* ── Button micro-interaction ── */
    document.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('pointerdown', () => {
        btn.style.transform = 'scale(0.94)';
        btn.style.opacity = '0.85';
      });
      ['pointerup', 'pointerleave'].forEach(evt => {
        btn.addEventListener(evt, () => {
          btn.style.transform = '';
          btn.style.opacity = '';
        });
      });
    });

    /* ── Keyboard nav support ── */
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          item.click();
        }
      });
    });
  </script>
</body>

</html>
